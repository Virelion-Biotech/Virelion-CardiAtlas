name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[test]'
      - name: Compile package
        run: python -m compileall -q cardiatlas tests
      - name: Run tests
        run: pytest -q
      - name: Smoke-test CLI
        run: |
          cardiatlas ontology --category phenotype > /tmp/phenotypes.json
          cardiatlas identifier TNNT2 > /tmp/identifier.json
          cardiatlas plan --domain myocardial_infarction > /tmp/plan.json
          cardiatlas corpus > /tmp/corpus.json
          python -m json.tool /tmp/phenotypes.json >/dev/null
          python -m json.tool /tmp/identifier.json >/dev/null
          python -m json.tool /tmp/plan.json >/dev/null
          python -m json.tool /tmp/corpus.json >/dev/null
      - name: Build checked-in reference Atlas
        run: cardiatlas build-reference --version "ci"
