name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[test]'
      - name: Compile package
        run: python -m compileall -q cardiatlas tests
      - name: Run tests
        run: pytest -q
      - name: Smoke-test CLI
        run: |
          cardiatlas ontology --category phenotype > /tmp/phenotypes.json
          cardiatlas identifier TNNT2 > /tmp/identifier.json
          cardiatlas harvest --domain myocardial_infarction --plan-only > /tmp/plan.json
          cardiatlas corpus > /tmp/corpus.json
          python -m json.tool /tmp/phenotypes.json >/dev/null
          python -m json.tool /tmp/identifier.json >/dev/null
          python -m json.tool /tmp/plan.json >/dev/null
          python -m json.tool /tmp/corpus.json >/dev/null
      - name: Build checked-in reference Atlas
        run: cardiatlas build-reference --version "ci"
      - name: Exercise GEO reconstruction CLI
        run: |
          cat > /tmp/dataset.json <<'EOF'
          {"id":"dataset:GSETEST","record_type":"dataset","name":"GSETEST","accession":"GSETEST","repository":"GEO","study_title":"CI cardiac study","organism":"Sus scrofa","tissue":"heart","schema_version":"0.3"}
          EOF
          cat > /tmp/samples.csv <<'EOF'
          accession,group,subject_id,timepoint,modality,region
          GSMTEST1,MI,pig-1,P35,snRNA-seq,infarct
          GSMTEST2,sham,pig-2,P35,snRNA-seq,remote
          EOF
          cardiatlas reconstruct-study /tmp/dataset.json /tmp/samples.csv --output /tmp/reconstructed
          test -s /tmp/reconstructed/study.json
          test -s /tmp/reconstructed/samples.jsonl
          test -s /tmp/reconstructed/report.json
      - name: Exercise GEO SOFT parser
        run: |
          python - <<'PY'
          from cardiatlas.geo_soft import parse_geo_soft, samples_to_rows
          text = '''
          ^SERIES = GSE999999
          ^SAMPLE = GSM1000001
          !Sample_title = MI sample
          !Sample_geo_accession = GSM1000001
          !Sample_organism_ch1 = Mus musculus
          !Sample_source_name_ch1 = heart
          !Sample_characteristics_ch1 = condition: MI
          !Sample_characteristics_ch1 = animal_id: mouse01
          !Sample_characteristics_ch1 = timepoint: 7 dpi
          !Sample_characteristics_ch1 = region: infarct zone
          '''
          rows = samples_to_rows(parse_geo_soft(text))
          assert rows[0]['accession'] == 'GSM1000001'
          assert rows[0]['condition'] == 'MI'
          assert rows[0]['animal_id'] == 'mouse01'
          PY
