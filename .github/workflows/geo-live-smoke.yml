name: GEO live smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reconstruct-gse153480:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Recheck live sample and bibliographic contracts
        run: |
          python -m pip install jsonschema
          python validation/run_cpu_validation.py --live --output /tmp/cardiatlas-live-results.json
      - name: Reconstruct live GEO study
        run: |
          rm -rf /tmp/cardiatlas-geo
          python -m cardiatlas.cli reconstruct-geo GSE153480 --output /tmp/cardiatlas-geo
          test -s /tmp/cardiatlas-geo/dataset.json
          test -s /tmp/cardiatlas-geo/study.json
          test -s /tmp/cardiatlas-geo/samples.jsonl
          test -s /tmp/cardiatlas-geo/report.json
          test -s /tmp/cardiatlas-geo/acquisition.json
      - name: Validate reconstructed study
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/cardiatlas-geo')
          rows = [json.loads(line) for line in (root / 'samples.jsonl').read_text().splitlines() if line.strip()]
          report = json.loads((root / 'report.json').read_text())
          acquisition = json.loads((root / 'acquisition.json').read_text())
          assert {row['modality'] for row in rows} == {'scrna'}
          assert {row['condition'] for row in rows} == {'myocardial_infarction', 'reference'}
          assert {row['timepoint'] for row in rows} == {'day1', 'day3'}
          assert all(row['subject_id'] is None for row in rows)
          assert report['benchmark_readiness']['ready'] is False
          assert 'subject_structure' in report['benchmark_readiness']['missing']
          assert len(rows) == 8, f'expected 8 GEO samples, got {len(rows)}'
          assert report['dataset']['accession'] == 'GSE153480'
          assert acquisition['accession'] == 'GSE153480'
          assert acquisition['sha256'] and len(acquisition['sha256']) == 64
          assert acquisition['payload_bytes'] > 0
          print(f"validated live GEO reconstruction: {len(rows)} samples, {acquisition['payload_bytes']} bytes")
          PY
      - name: Upload reconstruction artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-gse153480-reconstruction
          path: |
            /tmp/cardiatlas-geo/
            /tmp/cardiatlas-live-results.json
