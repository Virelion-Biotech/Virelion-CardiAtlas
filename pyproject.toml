[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "virelion-cardi-atlas"
version = "0.9.0"
description = "Structured cardiac biomedical knowledge, evidence, ontology, and provenance layer"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "jsonschema>=4", "build>=1"]

[project.scripts]
cardiatlas = "cardiatlas.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cardiatlas*"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
