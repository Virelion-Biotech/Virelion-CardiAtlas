[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virelion-cardi-atlas"
version = "0.4.0"
description = "Structured cardiac biomedical knowledge, evidence, ontology, and provenance layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cardiatlas = "cardiatlas.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cardiatlas*"]
